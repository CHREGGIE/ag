<!--
  Squarespace → Clio Grow lead relay.
  Paste into Squarespace: Settings › Developer Tools › Code Injection › FOOTER.
  Set RELAY_URL to your Cloudflare Worker address before pasting.

  When a visitor submits any Squarespace form, this copies the field labels and
  values and sends them to the Worker once the submission has gone through.
  Squarespace's own form storage and email notifications keep working.
-->
<script>
(function () {
  var RELAY_URL = "https://clio-lead.YOUR-SUBDOMAIN.workers.dev";
  var SKIP_FORMS = []; // form titles to ignore, e.g. ["Newsletter"]
  var FALLBACK_MS = 6000; // send anyway after this if the form looks valid

  var pending = new WeakMap(); // form -> cancel function for its last submit

  function text(n) { return n ? n.textContent : ""; }

  function labelFor(el, form) {
    if (el.id) {
      var l = form.querySelector('label[for="' + CSS.escape(el.id) + '"]');
      if (l) return text(l);
    }
    var by = el.getAttribute("aria-labelledby");
    if (by) {
      var t = by.split(" ").map(function (id) { return text(document.getElementById(id)); }).join(" ");
      if (t.trim()) return t;
    }
    var wrap = el.closest("label");
    if (wrap) return text(wrap);
    var fs = el.closest("fieldset");
    return text(fs && fs.querySelector("legend")) || el.getAttribute("aria-label") ||
      el.placeholder || el.name || "";
  }

  function capture(form) {
    var fields = [];
    form.querySelectorAll("input, select, textarea").forEach(function (el) {
      var type = (el.type || "").toLowerCase();
      if (["hidden", "submit", "button", "password", "file"].indexOf(type) > -1) return;
      if ((type === "checkbox" || type === "radio") && !el.checked) return;
      if (!el.value) return;
      var label = labelFor(el, form).replace(/\*/g, "").replace(/\(required\)/gi, "")
        .replace(/\s+/g, " ").trim();
      // Squarespace Name fields use fname/lname inputs; keep those names so
      // the Worker can tell first from last even when labels are generic.
      if (el.name === "fname" || el.name === "lname") label = el.name;
      var prev = fields[fields.length - 1];
      if (prev && prev.label === label) prev.value += " " + el.value; // multi-part fields (phone, checkboxes)
      else fields.push({ label: label, value: el.value });
    });
    return fields;
  }

  function formTitle(block) {
    return text(block.querySelector(".form-title, h2, h3")).trim();
  }

  function succeeded(block, form) {
    return !form.isConnected ||
      !!block.querySelector(".form-submission-text, [class*='submission-text'], [class*='form-success']");
  }

  function looksValid(form) {
    if (form.querySelector("[aria-invalid='true'], .field-error, [class*='field-error']")) return false;
    if (typeof form.checkValidity === "function" && !form.checkValidity()) return false;
    var ok = true;
    form.querySelectorAll("[required], [aria-required='true']").forEach(function (el) {
      if (!el.disabled && !String(el.value || "").trim()) ok = false;
    });
    return ok;
  }

  function send(payload) {
    try {
      fetch(RELAY_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload),
        keepalive: true,
        mode: "cors",
      }).catch(function () {});
    } catch (e) {}
  }

  document.addEventListener("submit", function (e) {
    var form = e.target;
    if (!(form instanceof HTMLFormElement)) return;
    var block = form.closest(".sqs-block-form, .form-block, .sqs-block") || form.parentElement;
    var title = formTitle(block);
    if (SKIP_FORMS.indexOf(title) > -1) return;

    // A new submit replaces any earlier attempt (e.g. one that failed validation).
    if (pending.has(form)) pending.get(form)();

    var payload = { fields: capture(form), pageUrl: location.href, formName: title };
    var done = false;
    var obs, timer;
    function finish(shouldSend) {
      if (done) return;
      done = true;
      obs.disconnect();
      clearTimeout(timer);
      pending.delete(form);
      if (shouldSend) send(payload);
    }
    obs = new MutationObserver(function () {
      if (succeeded(block, form)) finish(true);
    });
    obs.observe(block, { childList: true, subtree: true });
    // If Squarespace's success markup ever changes, still send a valid-looking
    // submission rather than silently dropping the lead.
    timer = setTimeout(function () { finish(succeeded(block, form) || looksValid(form)); }, FALLBACK_MS);
    pending.set(form, function () { finish(false); });
  }, true);
})();
</script>
